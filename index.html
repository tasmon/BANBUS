<style>

<script>

 const mo0=MO();S={t:0,money:300,fuel:mo0.tank,hp:mo0.hp,lvl:1,del:0,score:0,fines:0,sp:0,shake:0,wx:0,wt:50,bus:{x:B*2+100,y:B*3-L,a:0,v:0,inN:0,br:0},m:null,ref:0};
 cd={};cars=[];peds=[];cops=[];for(let k=0;k<7;k++)cops.push({x:RI(N)*B,y:RI(N)*B});for(let k=0;k<16;k++)spawn();
 for(let k=0;k<26;k++){const i=RI(N),j=RI(N),h=RI(2),o=(RW/2+32)*(RI(2)?1:-1),p=h?{ax:i*B+o,ay:j*B-RW/2-8,bx:i*B+o,by:j*B+RW/2+8,g:1}:{ax:i*B-RW/2-8,ay:j*B+o,bx:i*B+RW/2+8,by:j*B+o,g:0};

function spawn(){for(let t=0;t<20;t++){const i=RI(N),j=RI(N),d=RI(4),ni=i+DX[d],nj=j+DY[d];if(ni<0||nj<0||ni>=N||nj>=N)continue;const f=R(.2,.8),x=(i+DX[d]*f)*B+LN[d][0],y=(j+DY[d]*f)*B+LN[d][1];
 if(S.bus&&Math.hypot(x-S.bus.x,y-S.bus.y)<450)continue;const r=Math.random(),ty=r<.3?1:r<.5?2:r<.62?3:0,pol=ty==0&&RI(7)==0;cars.push({x,y,d,gi:ni,gj:nj,ty,pol,l:[28,17,21,42][ty],sp:[R(90,160),R(55,85),R(100,140),R(70,105)][ty],v:0,w:0,g:0,hit:0,an:d*PI/2,col:pol?'#1e3a8a':CC[RI(CC.length)]});return}}

function loc(o){const b=S.bus,dx=o.x-b.x,dy=o.y-b.y,c=Math.cos(b.a),s=Math.sin(b.a);return[dx*c+dy*s,-dx*s+dy*c]}
function upd(dt){
 const b=S.bus,k=keys,mo=MO(),ph=Math.floor(S.t/8)%2;S.t+=dt;S.shake=Math.max(0,S.shake-dt);

 const gr=S.wx==1?.7:1;
 const gas=k.up&&S.fuel>0,br=k.down,sf=surf(b.x,b.y),mx=sf==2?130:sf==1?260:mo.mx*(S.wx==1?.92:1);b.br=br&&b.v>5;
 if(gas)b.v+=(b.v<0?500:mo.ac)*dt;
 if(br)b.v=b.v>0?Math.max(0,b.v-480*gr*dt):Math.max(-130,b.v-180*dt);
 b.v-=b.v*(sf?1.2:.28)*dt;if(!gas&&!br&&Math.abs(b.v)<8)b.v=0;if(b.v>mx)b.v=Math.max(mx,b.v-300*dt);
 b.a+=((k.right?1:0)-(k.left?1:0))*1.7*mo.turn*(S.wx==1?.85:1)*dt*Math.max(-1,Math.min(1,b.v/110))*(1-Math.min(.5,Math.abs(b.v)/900));
 b.x=Math.max(-300,Math.min(SZ+300,b.x+Math.cos(b.a)*b.v*dt));b.y=Math.max(-300,Math.min(SZ+300,b.y+Math.sin(b.a)*b.v*dt));

 if(S.fuel<=0&&Math.abs(b.v)<8){const s=stn.reduce((a,c)=>Math.hypot(c.x-b.x,c.y-b.y)<Math.hypot(a.x-b.x,a.y-b.y)?c:a);fine(250,'Towing fee');b.x=s.x;b.y=s.y-L;b.a=0;b.v=0;S.fuel=15}
 const kmh=Math.abs(b.v)*.17,lim=b.x>2*B&&b.x<5*B&&b.y>2*B&&b.y<5*B?30:50;S.lim=lim;S.kmh=kmh;
 S.sp=kmh>lim+8?S.sp+dt:0;if(S.sp>1.2)fineCd('spd',8,lim==30?60:40,'Speeding');
 if(sf==2&&Math.abs(b.v)>30)fineCd('off',5,30,'Off-road driving');
 const gx=Math.round(b.x/B)*B,gy=Math.round(b.y/B)*B,inN=Math.abs(b.x-gx)<RW/2&&Math.abs(b.y-gy)<RW/2&&gx>=0&&gx<=SZ&&gy>=0&&gy<=SZ;
 if(inN&&!b.inN&&Math.abs(b.v)>70){const hz=Math.abs(Math.cos(b.a))>Math.abs(Math.sin(b.a));if(hz?ph==1:ph==0)fine(75,'Red light')}b.inN=inN;
 S.ref=0;for(const s of stn)if(Math.hypot(s.x-b.x,s.y-b.y)<90&&Math.abs(b.v)<60){S.ref=1;const a=Math.min(14*dt,mo.tank-S.fuel,Math.max(0,S.money)/3);if(a>0){S.fuel+=a;S.money-=a*3;if(Math.random()<.1)tone(600+S.fuel*4,.08,'sine',.05)}}
 const m=S.m,T=tgt();if(m.load){m.tl-=dt}
 if(Math.hypot(T.x-b.x,T.y-b.y)<70&&Math.abs(b.v)<40){m.hold+=dt;if(m.hold>1.2){m.hold=0;if(!m.load){m.load=1;const dd=Math.abs(stops[m.p].x-stops[m.d].x)+Math.abs(stops[m.p].y-stops[m.d].y);m.tl=dd/170+22-Math.min(8,S.lvl);toast('🧍 '+m.pax+' passengers boarded','good');tone(660,.15,'sine',.15);tone(880,.2,'sine',.15,.12)}
  else{let f=Math.round(m.pax*12*mo.fare),bo=Math.max(0,m.tl)*2|0;if(m.tl<0){f*=.5;bo=0;toast('Late arrival: half fare','bad')}f|=0;S.money+=f+bo;S.score+=f+bo;S.del++;toast(`+৳${f+bo} delivered${bo?' (bonus ৳'+bo+')':''}`,'good');[660,880,1100].forEach((q,i)=>tone(q,.2,'sine',.15,i*.1));
   if(S.del%3==0){S.lvl++;toast('Level '+S.lvl+': heavier traffic','good')}mission()}}}else m.hold=0;
 const vis=cars.length<Math.min(34,14+S.lvl*3);if(vis)spawn();
 for(const c of cars){const tx=c.gi*B,ty=c.gj*B,dn=(tx-c.x)*DX[c.d]+(ty-c.y)*DY[c.d],red=c.d%2==0?ph==1:ph==0;
  let go=c.sp,lt=red&&dn>RW/2-8&&dn<RW/2+55,bl=0;if(lt||c.hit>0)go=0;c.hit-=dt;
  for(const o of cars.concat([b])){if(o===c)continue;const rx=o.x-c.x,ry=o.y-c.y,f=rx*DX[c.d]+ry*DY[c.d],l=Math.abs(rx*DY[c.d]-ry*DX[c.d]);if(f>0&&f<80&&l<30){if(f<50){go=0;bl=1}else go=Math.min(go,c.sp*.4)}}
  if(bl){c.w+=dt;if(c.w>5){c.g=2.5;c.w=0}}else c.w=0;if(c.g>0){c.g-=dt;go=lt?0:c.sp}

function draw(){
 X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#2f6b3a';X.fillRect(0,0,W,H);const b=S.bus,sh=S.shake>0?(Math.random()-.5)*S.shake*30:0,ph=Math.floor(S.t/8)%2;

 const vx=W/2/Z+160,vy=H/2/Z+160,vi=(x,y,r=0)=>Math.abs(x-b.x)<vx+r&&Math.abs(y-b.y)<vy+r,e=RW/2+14,bw=B-RW-28;
 for(let i=0;i<N-1;i++)for(let j=0;j<N-1;j++){const x=i*B+e,y=j*B+e;if(!vi(x+bw/2,y+bw/2,bw/2))continue;
